claw:
  knowledge:
    globalEnabled: true

  global-tools:
    - memory_manage
    - time_query
    - skill_knowledge_manage

  common-capability-tools:
    - file_generate
    - file_save
    - file_read
    - file_search
    - image_generate
    - text_to_speech
    - create_schedule_task
    - list_schedule_tasks
    - update_schedule_task
    - cancel_schedule_task
    - web_search
    - holiday_check
    - goal_manage
    # 地点推荐/景点查询是通用地图能力，不要求先进入 travel 技能
    - map_search_place

  skills:
    common:
      enabled: true
      priority: 0
      tags: [通用]
      requiredTools: []
      optionalTools: []
      systemPromptResource: prompts/skills/common.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    campus:
      enabled: true
      priority: 4
      tags: [校园, 课程]
      description: 管理用户个人课表和考试安排，包括从图片或文件导入并预览课表、按具体日期查询课程、修改课程及查询提醒状态。仅用于用户自己的课程和考试；课程推荐、学校介绍、知识讲解和普通文件导入不属于本技能。
      triggerPolicyName: campusTriggerPolicy
      requiredTools:
        - course_schedule
      optionalTools:
        - exam_schedule
        - exam_reminder_setup
      systemPromptResource: prompts/skills/campus.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    travel:
      enabled: true
      description: 规划、调整用户的旅行行程、预算和方案，续接目的地、人数、日期等补充信息；旅游知识讲解、一般写作和闲聊不属于本技能。
      priority: 5
      tags: [出行, 方案]
      requiredTools:
        - travel_collect
        - travel_save_options
        - travel_select_option
        - travel_revise
      optionalTools:
        - travel_calculate_cost
        - map_search_place
        - map_route_planning
        - map_distance_calculate
        - weather_query
        - transport_recommend
        - place_image_search
      systemPromptResource: prompts/skills/travel.txt
      triggerPolicyName: travelTriggerPolicy
      knowledge:
        enabled: false
        namespaces: [travel]
        topK: 5
        minScore: 0.50
        maxContextChars: 12000

    transport:
      enabled: true
      description: 交通方式推荐、路线比较，续接出发地、目的地等补充信息；一般写作、闲聊和交通知识解释不属于本技能。
      priority: 4
      tags: [出行, 交通]
      requiredTools:
        - transport_recommend
      optionalTools:
        - map_search_place
        - map_route_planning
        - map_distance_calculate
      systemPromptResource: prompts/skills/transport.txt
      triggerPolicyName: transportTriggerPolicy
      knowledge:
        enabled: false
        namespaces: [transport]
        topK: 3
        minScore: 0.50
        maxContextChars: 6000

    weather:
      enabled: true
      description: 查询具体地点和日期的天气、气温与降水，支持地点和日期的省略追问；天气知识讲解、天气相关写作和闲聊不属于本技能。
      priority: 2
      tags: [天气]
      requiredTools: [weather_query]
      optionalTools: []
      systemPromptResource: prompts/skills/weather.txt
      triggerPolicyName: keywordTriggerPolicy

    anime:
      enabled: true
      priority: 4
      tags: [动漫, 番剧]
      description: 动漫番剧订阅与推荐。管理追番列表、搜索番剧、订阅/取消订阅、查询播出时间、推荐当季新番。
      requiredTools: []
      optionalTools:
        - anime_recommend
        - anime_subscribe
      systemPromptResource: prompts/skills/anime.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    image:
      enabled: true
      priority: 5
      tags: [图片]
      description: 图片生成。根据用户描述生成写实、卡通、水墨、油画、素描等风格的图片，适用于画图、生成图片、绘图请求。
      requiredTools:
        - image_generate
      optionalTools: []
      systemPromptResource: prompts/skills/image.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    growth-goal:
      enabled: true
      priority: 3
      tags: [目标, 成长]
      description: 管理用户的长期成长目标。创建、查看、推进和取消学习、竞赛、项目等长期目标，设置成功标准和截止日期。
      requiredTools:
        - goal_manage
      optionalTools: []
      systemPromptResource: prompts/skills/growth-goal.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0
